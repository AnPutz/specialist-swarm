<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wichtel Bid Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#0a1020; --panel:#111a2e; --panel2:#16213a; --line:#24314f; --text:#e8ecf5; --muted:#8a96b2;
  --gold:#e8b64c; --red:#c8323c; --green:#2f9e66; --blue:#4c8ee8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d1730,#0a1020)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.brand b{font-size:17px;letter-spacing:.2px}.brand div{color:var(--muted);font-size:12px}
#snd{margin-left:auto;padding:7px 12px}
.kpis{margin-left:12px;display:flex;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:100px}
.kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{font:600 18px "JetBrains Mono",monospace;color:var(--gold)}
main{display:grid;grid-template-columns:260px 1fr 270px;gap:12px;padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
textarea{flex:1;min-height:240px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 "JetBrains Mono",monospace}
button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font:600 13px Inter;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#1b1404;border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
#phase{font-weight:600;color:var(--gold);min-height:20px}
.mapwrap{position:relative;min-width:0;display:flex;justify-content:center;align-items:flex-start}
#map{display:block;border-radius:12px;border:1px solid var(--line);background:#1c2238;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:#f3dfc0;background:rgba(10,16,32,.72);border-radius:99px;padding:3px 10px;pointer-events:none}
#card{position:absolute;width:280px;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:5}
#card[hidden]{display:none}
#card .hd{display:flex;gap:10px;align-items:center;padding-right:18px}
#card .ic{font-size:30px}
#card .nm{font-weight:700;font-size:15px}
#card .rl{color:var(--gold);font-size:12.5px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 8px;font-size:12px}
#card dt{color:var(--muted)} #card dd{margin:0}
#card pre{margin:0;max-height:120px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:7px;font:10.5px/1.4 "JetBrains Mono",monospace;color:#a9b6d3}
#card pre:empty{display:none}
#card .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
#log{flex:1;overflow-y:auto;font:11px/1.45 "JetBrains Mono",monospace;color:#a9b6d3;max-height:calc(100vh - 130px)}
#log div{padding:2px 0;border-bottom:1px dashed #1c2740}
#log .t{color:var(--muted)} #log .g{color:var(--gold)} #log .ok{color:#5fd39a} #log .e{color:#ff7a82} #log .c{color:#ffa45c}
#result{display:none;margin:0 12px 24px;background:#fbfaf6;color:#1d2433;border-radius:12px;padding:28px 40px;border-top:6px solid var(--red)}
#result.show{display:block}
#result .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#result .head b{font-size:13px;color:#6a7286;text-transform:uppercase;letter-spacing:1px}
#result .head .row{margin-left:auto}
#result button{background:#1d2433;color:#fff;border-color:#1d2433}
#doc{max-width:900px;font-size:14.5px;line-height:1.6}
#doc table{border-collapse:collapse;margin:10px 0}#doc td,#doc th{border:1px solid #d6d9e0;padding:5px 9px}#doc th{background:#eef0f4}
#doc h1{color:var(--red)} #doc h2{border-bottom:1px solid #e3e5ea;padding-bottom:4px;margin-top:28px}
@media (max-width:1200px){main{grid-template-columns:1fr}#log{max-height:300px}.kpis{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">🎁</div>
  <div class="brand"><b>Wichtel GmbH &amp; Co. KG</b><div>North Pole bid floor · commerce consulting for fable creatures since 1823</div></div>
  <button id="snd" title="Toggle sound">🔊 Sound on</button>
  <div class="kpis">
    <div class="kpi"><span>Active agents</span><b id="kActive">0</b></div>
    <div class="kpi"><span>Tokens</span><b id="kTok">0</b></div>
    <div class="kpi"><span>Tokens/s</span><b id="kRate">0</b></div>
    <div class="kpi"><span>Parcels</span><b id="kPak">0</b></div>
    <div class="kpi"><span>Elapsed</span><b id="kTime">0.0 s</b></div>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Request for proposal</h2>
    <textarea id="rfp" placeholder="Paste an RFP or upload a file (.md/.txt) …"></textarea>
    <div class="row">
      <label class="btn">Upload file<input id="file" type="file" accept=".md,.txt,.markdown,text/plain" hidden></label>
      <button class="sample" data-sample="wunschzettel">Sample: Wish lists</button>
      <button class="sample" data-sample="kinder">Sample: Children</button>
    </div>
    <button id="go" class="primary">Write the proposal</button>
    <div id="phase"></div>
  </section>
  <section class="mapwrap" id="wrap">
    <canvas id="map"></canvas>
    <div class="hint">Click a character to see its role</div>
    <div id="card" hidden><button class="x" aria-label="Close">×</button>
      <div class="hd"><span class="ic"></span><div><div class="nm"></div><div class="rl"></div></div></div>
      <dl><dt>Workstation</dt><dd class="dk"></dd><dt class="skt">Skills</dt><dd class="sk"></dd><dt>Status</dt><dd class="stt"></dd><dt>Tokens</dt><dd class="tk"></dd></dl>
      <pre class="tx"></pre>
    </div>
  </section>
  <section class="panel"><h2>Radio log</h2><div id="log"></div></section>
</main>
<section id="result">
  <div class="head"><b>Proposal · ready to ship</b>
    <div class="row"><button id="dl">Download Markdown</button><button id="pdf">Print as PDF</button></div></div>
  <div id="doc"></div>
</section>
<script>
const $ = s => document.querySelector(s);
const canvas = $('#map'), ctx = canvas.getContext('2d'), wrap = $('#wrap');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 1440, H = 840, WALL = 84;
const MAXTOK = {chapter: 1800, spec: 1100, critic: 450, intake: 600};
let desks = {}, chars = {}, couriers = [], tokens = 0, packages = 0, t0 = 0, running = false, finalMd = '';
let scale = 1, mapImg = null, selected = null;

// ---------- world layout ----------
const COLS = [180, 450, 720, 990, 1260];
const DOORS = [   // inside point (ix,iy) and outside point (ox,oy)
  {x: 315, y: WALL, ix: 315, iy: 112, ox: 315, oy: 40, side: 'top'},
  {x: 1125, y: WALL, ix: 1125, iy: 112, ox: 1125, oy: 40, side: 'top'},
  {x: 12, y: 430, ix: 54, iy: 430, ox: -16, oy: 430, side: 'left'},
  {x: W - 12, y: 430, ix: W - 54, iy: 430, ox: W + 16, oy: 430, side: 'right'},
  {x: 180, y: H - 12, ix: 180, iy: H - 52, ox: 180, oy: H + 16, side: 'bottom'},
];
const PROPS = {oberelf: '🗺️', rudolph: '🖥️', zahnfee: '🧮', nornen: '📜', drache: '🔐', abraxas: '🔭', einhorn: '🎨',
  troll: '🔌', kobold: '🛠️', sandmann: '📅', riese: '👥', ruprecht: '✅', krampus: '💰', holle: '🖋️', poststelle: '📮', versand: '📦'};
const BODY = {oberelf: '#2f9e66', rudolph: '#8a5a35', zahnfee: '#c38ad6', nornen: '#6b6f8a', drache: '#3f8f4f', abraxas: '#2b2d38',
  einhorn: '#e9a6c8', troll: '#6f7f45', kobold: '#d9752b', sandmann: '#3b4f9e', riese: '#8d8378', ruprecht: '#5a3b26',
  krampus: '#8f1f2a', holle: '#c9d6ea'};
const CURSES = ['Holy reindeer droppings!', 'By all pointy hats!', 'Not another parcel!', 'Jingle my bells, enough!',
  'Who ordered THIS?!', 'Great Krampus!', 'Sweet sugarplums, no!', 'I only have two hands!', 'Tinsel and thunder!',
  'Oh, fruitcake!', 'Frozen mistletoe!', 'Again?! Seriously?!'];

// ---------- sound: synthesised with WebAudio, no audio files ----------
const sfx = (() => {
  let ac = null, out = null, on = true, noiseBuf = null, keysAcc = 0;
  try { on = localStorage.getItem('wichtel-sound') !== 'off'; } catch (e) {}
  function init(){
    if (ac || !on) return;
    ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // office room tone: low filtered noise (air conditioning) that loops forever
    const hum = ac.createBufferSource(); hum.buffer = noiseBuf; hum.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; const g = ac.createGain(); g.gain.value = .07;
    hum.connect(lp).connect(g).connect(out); hum.start();
  }
  const live = () => ac && on && ac.state === 'running';
  function noise(t, dur, type, freq, q, vol, attack = .002){
    const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + dur + .05); return f;
  }
  return {
    init, get on(){ return on; },
    toggle(){ on = !on; try { localStorage.setItem('wichtel-sound', on ? 'on' : 'off'); } catch (e) {}
      if (on){ init(); ac && ac.resume(); } else if (ac) ac.suspend(); return on; },
    whip(){ if (!live()) return; const t = ac.currentTime;
      const sw = noise(t, .22, 'bandpass', 400, 2, .25, .12); sw.frequency.exponentialRampToValueAtTime(2500, t + .2);   // swoosh
      noise(t + .2, .09, 'highpass', 1800, .7, 1.1, .001); noise(t + .2, .05, 'bandpass', 3800, 3, .6, .001); },        // crack
    babble(id){ if (!live()) return; let h = 0; for (const ch of id) h = h * 31 + ch.charCodeAt(0) & 0xffff;
      const base = 150 + h % 170, n = 6 + h % 5; let t = ac.currentTime;
      for (let i = 0; i < n; i++){ const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), d = .06 + Math.random() * .05;
        o.type = 'sawtooth'; o.frequency.setValueAtTime(base * (.85 + Math.random() * .4), t); o.frequency.linearRampToValueAtTime(base * (.8 + Math.random() * .5), t + d);
        f.type = 'bandpass'; f.frequency.value = 600 + Math.random() * 1600; f.Q.value = 5;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .01); g.gain.linearRampToValueAtTime(0, t + d);
        o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + d + .02); t += d + .015; } },
    // office bed: keyboard clicks scale with the number of busy agents, plus a phone or mug now and then
    tick(dt, busy){ if (!live()) return; keysAcc += dt * (2 + busy * 5);
      while (keysAcc > 1){ keysAcc--; noise(ac.currentTime + Math.random() * .1, .03, 'highpass', 2500 + Math.random() * 2500, 1, .05 + Math.random() * .05); }
      if (Math.random() < dt * .04){ const t = ac.currentTime;   // phone ring
        for (let r = 0; r < 2; r++) for (const fr of [1300, 1700]){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = fr;
          g.gain.setValueAtTime(0, t + r * .5); g.gain.linearRampToValueAtTime(.025, t + r * .5 + .02); g.gain.setValueAtTime(.025, t + r * .5 + .35); g.gain.linearRampToValueAtTime(0, t + r * .5 + .4);
          o.connect(g).connect(out); o.start(t + r * .5); o.stop(t + r * .5 + .45); } }
      if (Math.random() < dt * .06){ const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = 'sine'; o.frequency.value = 2200 + Math.random() * 900;
        g.gain.setValueAtTime(.04, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(out); o.start(t); o.stop(t + .45); } }   // mug clink
  };
})();
addEventListener('pointerdown', () => { sfx.init(); }, {once: true});

// ---------- Claude, the overseer: patrols, cracks the whip, elves nearby hurry ----------
const boss = {a: {id: 'claude', icon: '🟧', name: 'Claude', title: 'Overseer · cracks the whip so the elves hurry'}, d: {name: 'The whole floor'},
  x: 720, y: 560, tx: 720, ty: 560, wait: 1, face: 1, moving: false, crack: -1e9, status: 'idle', tok: 0, buf: '', label: '',
  hop: 0, target: null, bubble: null, blink: 0};
const BOSS_LINES = ['Faster, elves!', 'Chop chop!', 'Deadline is midnight!', 'Move it, move it!', 'Less chit-chat, more parcels!',
  'Tokens are cheap, time is not!', 'Did I say break?', 'Santa is waiting!'];
function pickBoss(){
  const busy = running ? Object.values(chars).filter(c => c.status === 'work') : [];
  if (busy.length && Math.random() < .8){ const c = busy[Math.random() * busy.length | 0];
    boss.target = c; boss.tx = c.x + (c.x > 720 ? -72 : 72); boss.ty = c.y + 12; return; }
  boss.target = null;
  for (let i = 0; i < 20; i++){ const x = 120 + Math.random() * (W - 240), y = WALL + 80 + Math.random() * (H - WALL - 140);
    if (!blocked(x, y)){ boss.tx = x; boss.ty = y; return; } }
}
function crack(now, quiet){
  boss.crack = now; sfx.whip();
  if (!quiet) boss.bubble = {text: BOSS_LINES[Math.random() * BOSS_LINES.length | 0], t0: now, color: '#a8461f'};
  for (const e of couriers) if (Math.hypot(e.x - boss.x, e.y - boss.y) < 280) e.boost = now + 2500;
  if (boss.target && Math.random() < .35) setTimeout(() => curse(boss.target || chars.oberelf, performance.now()), 500);
}
function updBoss(dt, now){
  const b = boss; b.status = running ? 'work' : 'idle'; b.label = running ? 'Cracking the whip' : 'Patrolling';
  // cracks on the move too: every ~2 s during a run, now and then while idle
  if (!reduce && now - b.crack > (running ? 1600 + Math.random() * 1200 : 6000 + Math.random() * 6000)) crack(now, Math.random() < .6);
  if (b.wait > 0){ b.wait -= dt; b.moving = false; return; }
  const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy), sp = running ? 170 : 55;
  if (d < 4){ b.moving = false;
    if (b.target){ b.face = Math.sign(b.target.x - b.x) || 1; crack(now); b.wait = .6; }
    else b.wait = reduce ? 1e9 : 1 + Math.random() * 2;
    pickBoss(); return; }
  const st = Math.min(d, sp * dt); b.x += dx / d * st; b.y += dy / d * st; b.moving = true;
  if (Math.abs(dx) > 1) b.face = Math.sign(dx);
}
function drawBoss(now){
  const b = boss, s = .22, walk = b.moving ? Math.sin(now / 80) : 0, bob = Math.abs(walk) * 2;
  const R = (x0, y0, x1, y1) => ctx.fillRect((x0 - 205) * s, (y0 - 340) * s, (x1 - x0) * s, (y1 - y0) * s);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x, b.y + 2, 40, 8, 0, 0, 7); ctx.fill();
  if (selected === b){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(b.x, b.y + 2, 46, 10, 0, 0, 7); ctx.stroke(); }
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.face, 1);
  // legs, alternating while walking
  [[80, 105], [130, 155], [260, 285], [310, 335]].forEach(([l, r], i) => { const lift = (i % 2 ? walk : -walk) * 14;
    ctx.fillStyle = '#c4664a'; R(l, 280, r, 340 - Math.max(0, lift)); ctx.fillStyle = '#9e4c33'; R(l, 330 - Math.max(0, lift), r, 340 - Math.max(0, lift)); });
  ctx.translate(0, -bob);
  // body with light top edge, shaded belly and side shadow
  ctx.fillStyle = '#d97757'; R(55, 90, 360, 292); R(0, 190, 410, 242);
  ctx.fillStyle = '#ec9878'; R(55, 90, 360, 102); R(0, 190, 55, 198); R(360, 190, 410, 198);
  ctx.fillStyle = '#bf6143'; R(55, 268, 360, 292); R(0, 232, 55, 242); R(360, 232, 410, 242); R(342, 102, 360, 268);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; for (let y = 110; y < 260; y += 26) R(70, y, 340, y + 4);
  // overseer cap
  ctx.fillStyle = '#2a2230'; R(95, 62, 320, 92); R(70, 84, 345, 96); ctx.fillStyle = '#e8b64c'; R(190, 68, 225, 84);
  // eyes: white, pupils look ahead, blink now and then, angry brows while cracking
  const cracking = now - b.crack < 700, blink = (now % 4200) < 130 ? .15 : 1, eh = 48 * blink, ey = 166 - eh / 2;
  ctx.fillStyle = '#fff'; R(107, ey, 131, ey + eh); R(284, ey, 308, ey + eh);
  ctx.fillStyle = '#2a1a14'; if (blink > .5){ R(119, 160, 131, 182); R(296, 160, 308, 182); }
  if (cracking){ ctx.fillStyle = '#2a1a14'; ctx.save(); ctx.translate((119 - 205) * s, (132 - 340) * s); ctx.rotate(.35); ctx.fillRect(-6, -2, 12, 3.5); ctx.restore();
    ctx.save(); ctx.translate((296 - 205) * s, (132 - 340) * s); ctx.rotate(-.35); ctx.fillRect(-6, -2, 12, 3.5); ctx.restore(); }
  // whip: handle in the front hand, lash swings over the head and snaps forward
  const hx = (410 - 205) * s, hy = (216 - 340) * s, p = (now - b.crack) / 380;
  let a = 1.25 + Math.sin(now / 420) * .12;
  if (p < 1) a = -2.7 + 2.95 * (1 - Math.pow(1 - p, 3)); else if (p < 2.2) a = .25 + (a - .25) * (p - 1) / 1.2;
  ctx.strokeStyle = '#5a3b26'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - 4, hy + 2); ctx.lineTo(hx + 8, hy - 8); ctx.stroke();
  const L = 70, ox = hx + 8, oy = hy - 8, tx = ox + Math.cos(a) * L, ty = oy + Math.sin(a) * L, lag = p < 1 ? -.8 : .35;
  ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(ox + Math.cos(a + lag) * L * .6, oy + Math.sin(a + lag) * L * .6, tx, ty); ctx.stroke();
  if (p > .8 && p < 1.4){ ctx.strokeStyle = '#ffd36a'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++){ const r = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(tx + Math.cos(r) * 4, ty + Math.sin(r) * 4); ctx.lineTo(tx + Math.cos(r) * 11, ty + Math.sin(r) * 11); ctx.stroke(); } }
  ctx.restore();
  if (p > .8 && p < 2){ ctx.save(); ctx.globalAlpha = Math.min(1, 2 - p); ctx.font = '900 italic 16px Inter'; ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd36a'; ctx.strokeStyle = '#3a1a0c'; ctx.lineWidth = 3; const cx = b.x + b.face * (hx + 8 + Math.cos(.25) * 70), cy = b.y + oy - 18 - (p - .8) * 12;
    ctx.strokeText('CRACK!', cx, cy); ctx.fillText('CRACK!', cx, cy); ctx.restore(); }
}

function layout(r){
  desks = {}; chars = {}; couriers = []; closeCard();
  const desk = (a, x, y, kind, w = 132, h = 52) => desks[a.id] = {a, x, y, w, h, kind, name: a.desk || a.name, glow: 0, done: false};
  const person = (a, kind) => { const d = desks[a.id];
    chars[a.id] = {a, kind, d, x: d.x + (Math.random() - .5) * 120, y: d.y + 70, tx: 0, ty: 0, state: 'wander', wait: Math.random() * 2,
      face: 1, moving: false, color: BODY[a.id] || '#4c8ee8', status: 'idle', label: '', buf: '', lines: [], tok: 0, max: 1100,
      jobs: 0, load: [], cool: 0, bubble: null, hop: Math.random() * 6}; };
  r.specialists.forEach((s, i) => { desk(s, COLS[i % 5], i < 5 ? 215 : 600, 'spec'); person(s, 'spec'); });
  desk(r.hub, 720, 410, 'hub', 230, 66); person(r.hub, 'hub');
  r.critics.forEach((c, i) => { desk(c, COLS[i + 1], 745, 'critic'); person(c, 'critic'); });
  desk(r.inbox, 95, 335, 'io', 96, 52); desk(r.outbox, 1345, 335, 'io', 96, 52);
  Object.values(chars).forEach(pickWander);

requestAnimationFrame(frame);

// ---------- click a character: short role card ----------
function world(ev){ const b = canvas.getBoundingClientRect(); return [(ev.clientX - b.left) / scale, (ev.clientY - b.top) / scale]; }
function hit(x, y){
  let best = null, bd = 40;
  for (const c of [...Object.values(chars), boss]){ const d = Math.hypot(c.x - x, c.y - 30 - y); if (d < bd){ bd = d; best = c; } }
  if (best) return best;
  const d = Object.values(desks).find(d => Math.abs(x - d.x) < d.w / 2 && Math.abs(y - d.y) < d.h / 2);
  return d && (chars[d.a.id] || {a: d.a, d, status: 'idle', tok: 0, buf: '', label: '', desk: true});
}
const STATUS = {idle: 'Idle, wandering', work: 'Working', done: 'Done', err: 'Error'};
function fillCard(){
  const c = selected, card = $('#card');
  card.querySelector('.ic').textContent = c.a.icon; card.querySelector('.nm').textContent = c.a.name;
  card.querySelector('.rl').textContent = c.a.title;
  card.querySelector('.dk').textContent = c.d?.name || c.a.name;
  const skills = c.a.skills || [];   // registered elf skills (elves.json); only specialists have them
  card.querySelector('.skt').hidden = card.querySelector('.sk').hidden = !skills.length;
  card.querySelector('.sk').textContent = skills.join(', ');
  card.querySelector('.stt').textContent = c.desk ? 'Station' : (STATUS[c.status] || c.status) + (c.label ? ` · ${c.label}` : '');
  card.querySelector('.tk').textContent = Math.round(c.tok).toLocaleString('en-US');
  card.querySelector('.tx').textContent = c.buf.slice(-500);
}
function closeCard(){ selected = null; $('#card').hidden = true; }
canvas.addEventListener('click', ev => {
  const [x, y] = world(ev), c = hit(x, y); if (!c){ closeCard(); return; }
  selected = c; fillCard(); const card = $('#card'); card.hidden = false;
  const b = canvas.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
  const left = Math.min(ev.clientX - wb.left + 14, wb.width - card.offsetWidth - 6), top = Math.min(ev.clientY - wb.top + 14, b.bottom - wb.top - card.offsetHeight - 6);
  card.style.left = Math.max(6, left) + 'px'; card.style.top = Math.max(6, top) + 'px';
});
canvas.addEventListener('mousemove', ev => { const [x, y] = world(ev); canvas.style.cursor = hit(x, y) ? 'pointer' : 'default'; });
$('#card .x').onclick = closeCard; addEventListener('keydown', e => e.key === 'Escape' && closeCard());

// ---------- log ----------
function log(html, cls){ const d = document.createElement('div'); const sec = t0 ? ((performance.now() - t0) / 1000).toFixed(1) : '0.0';
  d.innerHTML = `<span class="t">${sec.padStart(5)}s</span> <span class="${cls || ''}"></span>`; d.lastChild.textContent = html;
  const L = $('#log'); L.appendChild(d); L.scrollTop = L.scrollHeight; }
const nm = id => (chars[id] || desks[id])?.a.name || id;

// ---------- events ----------
function onEvent(e){
  const now = performance.now(), c = chars[e.agent];
  switch (e.type){
    case 'roster': break;
    case 'phase': $('#phase').textContent = e.label; log('▶ ' + e.label, 'g'); break;
    case 'handoff': courier(e.from, e.to, e.label, true); log(`📦 ${nm(e.from)} → ${nm(e.to)}: ${e.label}`); break;
    case 'agent_start': if (!c) break;
      c.buf = ''; c.tok = 0; c.lines = []; c.label = e.label;
      c.max = /^(Chapter|Executive)/.test(e.label) ? MAXTOK.chapter : e.label === 'Client understanding' ? MAXTOK.intake : c.kind === 'critic' ? MAXTOK.critic : MAXTOK.spec;
      if (c.jobs++ > 0) curse(c, now, true);   // a second job in one run is always worth a curse
      c.status = 'work'; goWork(c); sfx.babble(e.agent); log(`✍ ${c.a.name} starts: ${e.label}`); break;
    case 'delta': if (!c) break; c.buf += e.text; c.tok += Math.max(1, e.text.length / 4); tokens += Math.max(1, Math.round(e.text.length / 4)); c.dirty = true; break;
    case 'agent_done': if (!c) break; if (c.status !== 'err') c.status = 'done'; c.tok = c.max; goIdle(c);
      log(`✔ ${c.a.name} done (${e.tokens} tokens, ${e.seconds} s)`, 'ok'); break;
    case 'agent_error': if (!c) break; c.status = 'err'; log(`✖ ${c.a.name}: ${e.error}`, 'e'); break;
    case 'final': finalMd = e.markdown; break;
    case 'done': running = false; if (desks.versand) desks.versand.glow = 1;
      log(`🎁 Proposal ready: ${e.agents} agent runs, ${e.tokens.toLocaleString('en-US')} tokens, ${e.seconds} s`, 'g');
      $('#phase').textContent = 'Proposal ready to ship'; showResult(); break;
    case 'fatal': running = false; log('✖ ' + e.error, 'e'); $('#phase').textContent = 'Aborted'; $('#go').disabled = false; break;
  }
}
function showResult(){
  // model output may echo RFP content, so only render Markdown when it can be sanitised
  $('#doc').innerHTML = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(finalMd))
    : `<pre>${finalMd.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
  $('#result').classList.add('show'); $('#go').disabled = false;
  setTimeout(() => $('#result').scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}), 600);
}

async function run(){
  const rfp = $('#rfp').value.trim(); if (!rfp){ $('#rfp').focus(); return; }
  $('#go').disabled = true; $('#result').classList.remove('show'); $('#log').innerHTML = '';
  tokens = 0; packages = 0; finalMd = '';
  layout(await (await fetch('/api/roster')).json());
  running = true; t0 = performance.now();
  const res = await fetch('/api/run', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({rfp})});
  if (!res.ok){ running = false; log('✖ Server: ' + res.status, 'e'); $('#go').disabled = false; return; }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;){ const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true}); let i;
    while ((i = buf.indexOf('\n\n')) >= 0){ const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      if (chunk.startsWith('data: ')) onEvent(JSON.parse(chunk.slice(6))); } }
  if (running){ running = false; $('#go').disabled = false; }
}

$('#go').onclick = run;
const sndLabel = () => $('#snd').textContent = sfx.on ? '🔊 Sound on' : '🔇 Sound off'; sndLabel();
$('#snd').onclick = () => { sfx.toggle(); sndLabel(); };
document.querySelectorAll('.sample').forEach(b => b.onclick = async () => {
  $('#rfp').value = await (await fetch('/api/sample?name=' + encodeURIComponent(b.dataset.sample))).text();
});
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) $('#rfp').value = await f.text(); };
$('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([finalMd], {type: 'text/markdown'})); a.download = 'Proposal-Wichtel.md'; a.click(); };
$('#pdf').onclick = () => { const w = open(''); w.document.write(`<html><head><title>Proposal Wichtel GmbH & Co. KG</title><style>body{font:12pt/1.55 Georgia,serif;max-width:760px;margin:40px auto;color:#1d2433}h1{color:#c8323c}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}</style></head><body>${$('#doc').innerHTML}</body></html>`); w.document.close(); w.print(); };
fetch('/api/roster').then(r => r.json()).then(layout);
</script>
