<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wichtel Angebotszentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#0a1020; --panel:#111a2e; --panel2:#16213a; --line:#24314f; --text:#e8ecf5; --muted:#8a96b2;
  --gold:#e8b64c; --red:#c8323c; --green:#2f9e66; --blue:#4c8ee8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d1730,#0a1020)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.brand b{font-size:17px;letter-spacing:.2px}.brand div{color:var(--muted);font-size:12px}
.kpis{margin-left:auto;display:flex;gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:104px}
.kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{font:600 18px "JetBrains Mono",monospace;color:var(--gold)}
main{display:grid;grid-template-columns:300px 1fr 300px;gap:14px;padding:14px;min-height:calc(100vh - 70px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
textarea{flex:1;min-height:260px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 "JetBrains Mono",monospace}
button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 12px;font:600 13px Inter;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#1b1404;border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
#phase{font-weight:600;color:var(--gold);min-height:20px}
.floorwrap{overflow-x:auto}
#floor{position:relative;height:640px;min-width:900px;border-radius:12px;background:
  radial-gradient(circle at 50% 50%,rgba(232,182,76,.07),transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.025) 39px 40px),#0c1427;border:1px solid var(--line)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.st{position:absolute;width:172px;transform:translate(-50%,-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 9px;z-index:2;transition:border-color .2s,box-shadow .2s}
.st .top{display:flex;align-items:center;gap:7px}
.st .ic{font-size:20px;width:28px;text-align:center}
.st .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .rl{color:var(--muted);font-size:10.5px}
.st .pill{margin-left:auto;font-size:9.5px;padding:2px 6px;border-radius:99px;background:#26324d;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.st .tx{margin-top:6px;height:30px;overflow:hidden;font:9.5px/1.3 "JetBrains Mono",monospace;color:#a9b6d3;word-break:break-word;display:flex;flex-direction:column;justify-content:flex-end}
.st .bar{height:3px;background:#22304c;border-radius:2px;margin-top:5px;overflow:hidden}
.st .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
.st.work{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,182,76,.35),0 0 18px rgba(232,182,76,.15)}
.st.work .pill{background:var(--gold);color:#1b1404}
.st.done .pill{background:var(--green);color:#fff}
.st.done .bar i{background:var(--green)}
.st.err .pill{background:var(--red);color:#fff}
.st.hub{width:210px;border-color:#3a4a70}
.st.hub .ic{font-size:26px}
.st.ping{animation:ping .35s ease-out}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.05)}100%{transform:translate(-50%,-50%) scale(1)}}
#log{flex:1;overflow-y:auto;font:11px/1.45 "JetBrains Mono",monospace;color:#a9b6d3;max-height:calc(100vh - 140px)}
#log div{padding:2px 0;border-bottom:1px dashed #1c2740}
#log .t{color:var(--muted)} #log .g{color:var(--gold)} #log .ok{color:#5fd39a} #log .e{color:#ff7a82}
#result{display:none;margin:0 14px 24px;background:#fbfaf6;color:#1d2433;border-radius:12px;padding:28px 40px;border-top:6px solid var(--red)}
#result.show{display:block}
#result .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#result .head b{font-size:13px;color:#6a7286;text-transform:uppercase;letter-spacing:1px}
#result .head .row{margin-left:auto}
#result button{background:#1d2433;color:#fff;border-color:#1d2433}
#doc{max-width:900px;font-size:14.5px;line-height:1.6}
#doc table{border-collapse:collapse;margin:10px 0}#doc td,#doc th{border:1px solid #d6d9e0;padding:5px 9px}#doc th{background:#eef0f4}
#doc h1{color:var(--red)} #doc h2{border-bottom:1px solid #e3e5ea;padding-bottom:4px;margin-top:28px}
@media (max-width:1200px){main{grid-template-columns:1fr}#log{max-height:300px}.kpis{display:none}}
@media (prefers-reduced-motion:reduce){.st.ping{animation:none}}
</style>
</head>
<body>
<header>
  <div class="logo">🎁</div>
  <div class="brand"><b>Wichtel GmbH &amp; Co. KG</b><div>Angebotszentrale Nordpol · Commerce-Beratung für Fabelwesen seit 1823</div></div>
  <div class="kpis">
    <div class="kpi"><span>Aktive Agenten</span><b id="kActive">0</b></div>
    <div class="kpi"><span>Tokens</span><b id="kTok">0</b></div>
    <div class="kpi"><span>Tokens/s</span><b id="kRate">0</b></div>
    <div class="kpi"><span>Pakete</span><b id="kPak">0</b></div>
    <div class="kpi"><span>Laufzeit</span><b id="kTime">0,0 s</b></div>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Ausschreibung (RFP)</h2>
    <textarea id="rfp" placeholder="RFP hier einfügen oder Datei (.md/.txt) hochladen …"></textarea>
    <div class="row">
      <label class="btn">Datei hochladen<input id="file" type="file" accept=".md,.txt,.markdown,text/plain" hidden></label>
      <button id="sample">Beispiel: Weihnachtsmann</button>
    </div>
    <button id="go" class="primary">Angebot erstellen lassen</button>
    <div id="phase"></div>
  </section>
  <section class="floorwrap"><div id="floor"><canvas id="fx"></canvas></div></section>
  <section class="panel"><h2>Funkprotokoll</h2><div id="log"></div></section>
</main>
<section id="result">
  <div class="head"><b>Angebot · versandbereit</b>
    <div class="row"><button id="dl">Als Markdown laden</button><button id="pdf">Als PDF drucken</button></div></div>
  <div id="doc"></div>
</section>
<script>
const $ = s => document.querySelector(s);
const floor = $('#floor'), canvas = $('#fx'), ctx = canvas.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let stations = {}, active = new Set(), couriers = [], tokens = 0, packages = 0, t0 = 0, running = false, finalMd = '';
const MAXTOK = {chapter: 1800, spec: 1100, critic: 450, intake: 600};

// ---------- layout ----------
function layout(r){
  floor.querySelectorAll('.st').forEach(e => e.remove()); stations = {};
  const add = (a, x, y, kind) => {
    const el = document.createElement('div');
    el.className = 'st' + (kind === 'hub' ? ' hub' : '');
    el.style.left = x + '%'; el.style.top = y + '%';
    el.innerHTML = `<div class="top"><div class="ic">${a.icon}</div><div style="min-width:0"><div class="nm">${a.name}</div><div class="rl">${a.title}</div></div><div class="pill">bereit</div></div><div class="tx"></div><div class="bar"><i></i></div>`;
    if (a.skills && a.skills.length) el.title = 'Fähigkeiten: ' + a.skills.join(', ');
    floor.appendChild(el);
    stations[a.id] = {a, el, x, y, kind, buf: '', tok: 0, max: MAXTOK[kind] || 1100};
  };
  const cols = [11, 30.5, 50, 69.5, 89];
  r.specialists.forEach((s, i) => add(s, cols[i % 5], i < 5 ? 11 : 66, 'spec'));
  add(r.inbox, 11, 38.5, 'io'); add(r.hub, 50, 38.5, 'hub'); add(r.outbox, 89, 38.5, 'io');
  r.critics.forEach((c, i) => add(c, cols[i + 1], 90, 'critic'));
  resize();
}
function resize(){ const b = floor.getBoundingClientRect(); canvas.width = b.width * devicePixelRatio; canvas.height = b.height * devicePixelRatio; }
addEventListener('resize', resize);
function pos(id){ const s = stations[id], b = floor.getBoundingClientRect(); return [s.x / 100 * b.width, s.y / 100 * b.height]; }

// ---------- couriers (elves) ----------
const COLORS = ['#2f9e66', '#c8323c', '#4c8ee8', '#8a5cd6', '#d98a2b'];
function courier(from, to, label, big){
  if (!stations[from] || !stations[to]) return;
  const [x1, y1] = pos(from), [x2, y2] = pos(to);
  const dist = Math.hypot(x2 - x1, y2 - y1);
  couriers.push({x1, y1, x2, y2, t: 0, dur: (big ? 650 : 450) + dist * (big ? 1.4 : 0.9), label, big, to,
    color: COLORS[Math.random() * COLORS.length | 0], hop: Math.random() * 6, lane: (Math.random() - .5) * 26});
}
function drawElf(x, y, phase, c, big, label){
  const s = big ? 1.25 : .9;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const leg = Math.sin(phase) * 4;
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2, 6); ctx.lineTo(-2 - leg, 13); ctx.moveTo(2, 6); ctx.lineTo(2 + leg, 13); ctx.stroke();
  ctx.fillStyle = c; ctx.fillRect(-5, -3, 10, 10);                     // body
  ctx.fillStyle = '#f2cfa8'; ctx.beginPath(); ctx.arc(0, -7, 4.5, 0, 7); ctx.fill(); // head
  ctx.fillStyle = '#c8323c'; ctx.beginPath(); ctx.moveTo(-5, -9); ctx.lineTo(5, -9); ctx.lineTo(7, -19); ctx.fill(); // hat
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -19, 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = big ? '#e8b64c' : '#b98a4a'; ctx.fillRect(4, -4, 9, 8);   // parcel
  ctx.fillStyle = '#c8323c'; ctx.fillRect(7.6, -4, 1.8, 8);
  ctx.restore();
  if (big && label){ ctx.font = '600 10px Inter'; ctx.fillStyle = '#e8b64c'; ctx.fillText(label, x + 14, y - 14); }
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
let last = performance.now(), ambientAcc = 0;
function frame(now){
  const dt = Math.min(50, now - last); last = now;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // ambient traffic: every active agent constantly ships token parcels to and from the hub
  if (running && !reduce){
    ambientAcc += dt * active.size;
    while (ambientAcc > 260){ ambientAcc -= 260;
      const ids = [...active]; const a = ids[Math.random() * ids.length | 0];
      if (a && a !== 'oberelf') Math.random() < .5 ? courier(a, 'oberelf') : courier('oberelf', a);
      else if (a) { const o = Object.keys(stations).filter(k => stations[k].kind === 'spec'); courier('oberelf', o[Math.random() * o.length | 0]); }
    }
  }
  couriers = couriers.filter(c => {
    c.t += dt / c.dur; const k = ease(Math.min(1, c.t));
    const nx = -(c.y2 - c.y1), ny = c.x2 - c.x1, n = Math.hypot(nx, ny) || 1;
    const arc = Math.sin(k * Math.PI) * c.lane;
    const x = c.x1 + (c.x2 - c.x1) * k + nx / n * arc, y = c.y1 + (c.y2 - c.y1) * k + ny / n * arc - Math.abs(Math.sin(now / 60 + c.hop)) * 2;
    ctx.globalAlpha = .2; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, y + 16, 7, 2, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    drawElf(x, y, now / 45 + c.hop, c.color, c.big, c.label);
    if (c.t >= 1){ if (c.big){ packages++; ping(c.to); } return false; }
    return true;
  });
  // render streamed text at most once per frame
  for (const s of Object.values(stations)) if (s.dirty){ s.dirty = false;
    s.el.querySelector('.tx').textContent = s.buf.slice(-140);
    s.el.querySelector('.bar i').style.width = Math.min(100, s.tok / s.max * 100) + '%'; }
  $('#kActive').textContent = active.size; $('#kTok').textContent = tokens.toLocaleString('de-DE'); $('#kPak').textContent = packages;
  if (running){ const sec = (now - t0) / 1000; $('#kTime').textContent = sec.toFixed(1).replace('.', ',') + ' s'; $('#kRate').textContent = Math.round(tokens / Math.max(sec, .1)); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function ping(id){ const el = stations[id]?.el; if (!el) return; el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping'); }
function setState(id, cls, label){ const s = stations[id]; if (!s) return;
  s.el.classList.remove('work', 'done', 'err'); if (cls) s.el.classList.add(cls); s.el.querySelector('.pill').textContent = label; }

// ---------- log ----------
function log(html, cls){ const d = document.createElement('div'); const sec = t0 ? ((performance.now() - t0) / 1000).toFixed(1) : '0.0';
  d.innerHTML = `<span class="t">${sec.padStart(5)}s</span> <span class="${cls || ''}">${html}</span>`; const L = $('#log'); L.appendChild(d); L.scrollTop = L.scrollHeight; }
const nm = id => stations[id]?.a.name || id;

// ---------- events ----------
function onEvent(e){
  switch (e.type){
    case 'roster': break;
    case 'phase': $('#phase').textContent = e.label; log('▶ ' + e.label, 'g'); break;
    case 'handoff': courier(e.from, e.to, e.label, true); log(`📦 ${nm(e.from)} → ${nm(e.to)}: ${e.label}`); break;
    case 'agent_start': { const s = stations[e.agent]; s.buf = ''; s.tok = 0; s.max = /^(Kapitel|Executive)/.test(e.label) ? MAXTOK.chapter : e.label === 'Kundenverständnis' ? MAXTOK.intake : s.kind === 'critic' ? MAXTOK.critic : MAXTOK.spec;
      active.add(e.agent); setState(e.agent, 'work', 'arbeitet'); log(`✍ ${nm(e.agent)} beginnt: ${e.label}`); break; }
    case 'delta': { const s = stations[e.agent]; s.buf += e.text; s.tok += Math.max(1, e.text.length / 4); tokens += Math.max(1, Math.round(e.text.length / 4)); s.dirty = true; break; }
    case 'agent_done': active.delete(e.agent); setState(e.agent, 'done', 'fertig'); stations[e.agent].tok = stations[e.agent].max; stations[e.agent].dirty = true;
      log(`✔ ${nm(e.agent)} fertig (${e.tokens} Tokens, ${String(e.seconds).replace('.', ',')} s)`, 'ok'); break;
    case 'agent_error': setState(e.agent, 'err', 'Fehler'); log(`✖ ${nm(e.agent)}: ${e.error}`, 'e'); break;
    case 'final': finalMd = e.markdown; break;
    case 'done': running = false; setState('versand', 'done', 'versandt');
      log(`🎁 Angebot fertig: ${e.agents} Agenten-Läufe, ${e.tokens.toLocaleString('de-DE')} Tokens, ${String(e.seconds).replace('.', ',')} s`, 'g');
      $('#phase').textContent = 'Angebot versandbereit'; showResult(); break;
    case 'fatal': running = false; log('✖ ' + e.error, 'e'); $('#phase').textContent = 'Abgebrochen'; break;
  }
}
function showResult(){
  // model output may echo RFP content, so only render Markdown when it can be sanitised
  $('#doc').innerHTML = window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(finalMd))
    : `<pre>${finalMd.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre>`;
  $('#result').classList.add('show'); $('#go').disabled = false;
  setTimeout(() => $('#result').scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}), 600);
}

async function run(){
  const rfp = $('#rfp').value.trim(); if (!rfp){ $('#rfp').focus(); return; }
  $('#go').disabled = true; $('#result').classList.remove('show'); $('#log').innerHTML = '';
  tokens = 0; packages = 0; couriers = []; active.clear(); finalMd = '';
  layout(await (await fetch('/api/roster')).json());
  setState('poststelle', 'done', 'eingegangen');
  running = true; t0 = performance.now();
  const res = await fetch('/api/run', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({rfp})});
  if (!res.ok){ running = false; log('✖ Server: ' + res.status, 'e'); $('#go').disabled = false; return; }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;){ const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true}); let i;
    while ((i = buf.indexOf('\n\n')) >= 0){ const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      if (chunk.startsWith('data: ')) onEvent(JSON.parse(chunk.slice(6))); } }
  if (running){ running = false; $('#go').disabled = false; }
}

$('#go').onclick = run;
$('#sample').onclick = async () => { $('#rfp').value = await (await fetch('/api/sample')).text(); };
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) $('#rfp').value = await f.text(); };
$('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([finalMd], {type: 'text/markdown'})); a.download = 'Angebot-Wichtel.md'; a.click(); };
$('#pdf').onclick = () => { const w = open(''); w.document.write(`<html><head><title>Angebot Wichtel GmbH & Co. KG</title><style>body{font:12pt/1.55 Georgia,serif;max-width:760px;margin:40px auto;color:#1d2433}h1{color:#c8323c}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}</style></head><body>${$('#doc').innerHTML}</body></html>`); w.document.close(); w.print(); };
fetch('/api/roster').then(r => r.json()).then(layout);
</script>
</body>
</html>
